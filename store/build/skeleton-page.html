<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>视频页面（骨架示意）</title>
<style>
  :root{
    --bg:#ffffff; --line:#eceef1; --blk:#e9ecf0; --blk2:#f2f4f7;
    --ink:#c9cfd8; --accent:#5f7285; --video:#252a31;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#22262c;
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .top{height:56px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line)}
  .logo{width:96px;height:22px;border-radius:6px;background:var(--accent);opacity:.85}
  .search{flex:1;max-width:420px;height:32px;border-radius:16px;background:var(--blk2)}
  .nav{display:flex;gap:16px;margin-left:auto}
  .nav i{display:block;width:52px;height:12px;border-radius:6px;background:var(--blk)}
  .wrap{display:flex;gap:26px;padding:22px}
  .main{flex:1 1 auto;max-width:820px}
  .player{position:relative;height:430px;border-radius:12px;background:
     radial-gradient(120% 120% at 20% 0%, #333a44 0%, var(--video) 60%);
     display:flex;align-items:center;justify-content:center;overflow:hidden}
  .player .tri{width:0;height:0;border-left:34px solid rgba(255,255,255,.9);
     border-top:22px solid transparent;border-bottom:22px solid transparent;margin-left:8px}
  .bar{position:absolute;left:16px;right:16px;bottom:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
  .bar b{display:block;width:42%;height:100%;border-radius:2px;background:var(--accent)}
  .title{margin:16px 0 10px;height:18px;width:64%;border-radius:6px;background:var(--blk)}
  .meta{display:flex;gap:10px;margin-bottom:16px}
  .meta i{display:block;height:11px;border-radius:6px;background:var(--blk2);width:74px}
  .row{display:flex;gap:12px;margin-bottom:14px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--blk);flex:0 0 auto}
  .lines{flex:1 1 auto}
  .lines i{display:block;height:10px;border-radius:5px;background:var(--blk2);margin-bottom:8px}
  .lines i:nth-child(2){width:82%}
  .lines i:nth-child(3){width:56%}
  .side{flex:0 0 300px}
  .card{display:flex;gap:10px;margin-bottom:14px}
  .thumb{width:120px;height:68px;border-radius:8px;background:var(--blk);flex:0 0 auto}
  .card .lines i{background:var(--blk2)}
  .hint{position:fixed;left:22px;bottom:16px;font-size:12px;color:#aab2bd}
</style>
</head>
<body>
  <div class="top">
    <span class="logo"></span>
    <span class="search"></span>
    <span class="nav"><i></i><i></i><i></i></span>
  </div>
  <div class="wrap">
    <div class="main">
      <div class="player">
        <span class="tri"></span>
        <span class="bar"><b></b></span>
      </div>
      <div class="title"></div>
      <div class="meta"><i></i><i></i><i></i></div>
      <div class="row"><span class="av"></span><span class="lines"><i></i><i></i><i></i></span></div>
      <div class="row"><span class="av"></span><span class="lines"><i></i><i></i></span></div>
      <div class="row"><span class="av"></span><span class="lines"><i></i><i></i><i></i></span></div>
    </div>
    <div class="side">
      <div class="card"><span class="thumb"></span><span class="lines"><i></i><i></i></span></div>
      <div class="card"><span class="thumb"></span><span class="lines"><i></i><i></i></span></div>
      <div class="card"><span class="thumb"></span><span class="lines"><i></i><i></i></span></div>
      <div class="card"><span class="thumb"></span><span class="lines"><i></i><i></i></span></div>
    </div>
  </div>
  <div class="hint">示意页面（骨架）· 用于展示扩展在页面内的悬浮速度按钮</div>
</body>
</html>
